<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons. The SVG is the full mark on a Night tile at 84% and is what
         modern browsers use; the .ico carries 16/24/32/48 for everything
         else. Both are rasterised from the same tile, so they never drift. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Night, so the browser chrome matches the page rather than framing it. -->
    <meta name="theme-color" content="#100A28" />

    <!-- Primary SEO -->
    <title>Slav Lambov | Frontend Developer</title>
    <meta
      name="description"
      content="Frontend Developer based in Manchester, UK. Specialising in React, animations, and UI systems. Available for junior roles and freelance work. Portfolio of Slav Lambov."
    />
    <meta name="author" content="Slav Lambov" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spireforge" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Slav Lambov | Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend Developer in Manchester, UK specialising in React, animations, and high-performance UI systems. View my portfolio."
    />
    <meta property="og:url" content="https://spireforge.co.uk/" />

    <!-- The card. PNG, because the one this replaces was an SVG in the retired
         STL Media palette quoting a dead github.io URL, and X, Facebook and
         LinkedIn do not render SVG -- so no preview has ever actually worked.

         The URL is absolute and not relative: crawlers fetch it without the
         page's base, and a relative path is the single most common reason a
         card silently renders blank.

         1200x630 is the size every platform crops from. It is rendered from
         tools/og-card.html with the real fonts and the real tokens rather than
         redrawn by eye -- see that file to regenerate. -->
    <meta property="og:image" content="https://spireforge.co.uk/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Spireforge. For eight years I ran a supermarket. Now I build the software that would have made the job easier. Slav Lambov, junior developer, Manchester, UK."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slav Lambov | Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend developer based in Manchester, UK. React, animations, design systems, and performance. Portfolio of Slav Lambov."
    />
    <meta name="twitter:image" content="https://spireforge.co.uk/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Spireforge. For eight years I ran a supermarket. Now I build the software that would have made the job easier. Slav Lambov, junior developer, Manchester, UK."
    />

    <!-- Canonical & robots -->
    <link rel="canonical" href="https://spireforge.co.uk/" />
    <meta name="robots" content="index, follow" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Slav Lambov",
        "url": "https://spireforge.co.uk/",
        "jobTitle": "Frontend Developer",
        "email": "hello@spireforge.co.uk",
        "sameAs": [
          "https://github.com/STL73",
          "https://www.linkedin.com/in/slavi-lambov-a69a65229"
        ],
        "knowsAbout": ["React", "JavaScript", "Tailwind CSS", "GSAP", "Vite", "Node.js", "PHP", "MySQL"],
        "description": "Frontend Developer specialising in React, animations, and UI systems. Based in Manchester, UK. Available for junior roles and freelance work.",
        "location": { "@type": "Place", "name": "Manchester, UK" },
        "areaServed": ["United Kingdom", "Remote"]
      }
    </script>

    <!-- Fonts are self-hosted in src/styles/fonts.css. The design system bans
         third-party font CDNs in production: a render-blocking request to a
         host you do not control. The Google Fonts link that sat here loaded
         Syne and DM Sans, both of which belonged to the retired identity. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
