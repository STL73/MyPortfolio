<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>

  <!-- Radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Top accent line -->
  <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="50%" stop-color="#6366f1"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <rect x="0" y="0" width="800" height="2" fill="url(#line)"/>

  <!-- Grid dots decoration -->
  <g opacity="0.08" fill="#6366f1">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="150" cy="100" r="2"/>
    <circle cx="200" cy="100" r="2"/>
    <circle cx="100" cy="150" r="2"/>
    <circle cx="150" cy="150" r="2"/>
    <circle cx="200" cy="150" r="2"/>
    <circle cx="600" cy="300" r="2"/>
    <circle cx="650" cy="300" r="2"/>
    <circle cx="700" cy="300" r="2"/>
    <circle cx="600" cy="350" r="2"/>
    <circle cx="650" cy="350" r="2"/>
    <circle cx="700" cy="350" r="2"/>
  </g>

  <!-- Icon placeholder - image icon outline -->
  <rect x="340" y="160" width="120" height="90" rx="8" fill="none" stroke="#6366f133" stroke-width="1.5"/>
  <circle cx="365" cy="185" r="10" fill="none" stroke="#6366f133" stroke-width="1.5"/>
  <polyline points="340,230 375,200 405,220 430,195 460,230" fill="none" stroke="#6366f133" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Label -->
  <text x="400" y="290" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="500">Project Preview</text>
  <text x="400" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Replace with screenshot</text>
</svg>
